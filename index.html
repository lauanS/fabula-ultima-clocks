<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Relógios</title>
<style>
  :root{
    --primary:#3D6B5E;
    --secondary:#7BACA8;
    --positive:#3D6B5E;
    --negative:#C97B6E;
    --neutral:#F7F9F8;
    --neutral-stroke:#D9E2DE;
    --bg:#FBFCFC;
    --text:#3A463F;
    --text-soft:#7A8780;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
  }
  .screen{
    position:fixed;inset:0;
    display:none;
    flex-direction:column;
  }
  .screen.active{display:flex;}

  /* ---------- Formulário ---------- */
  #form-screen{
    align-items:center;justify-content:center;
    padding:24px;
  }
  .card{
    background:#fff;
    border:1px solid var(--neutral-stroke);
    border-radius:18px;
    padding:32px 28px;
    width:100%;max-width:380px;
    display:flex;flex-direction:column;gap:18px;
  }
  .card h1{
    font-size:1.4rem;font-weight:600;color:var(--primary);
    text-align:center;letter-spacing:.3px;
  }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:.8rem;color:var(--text-soft);}
  .field input{
    border:1px solid var(--neutral-stroke);
    border-radius:10px;padding:12px 14px;font-size:1rem;
    background:var(--neutral);color:var(--text);
    outline:none;transition:border-color .2s;
  }
  .field input:focus{border-color:var(--secondary);}
  .btn{
    border:none;border-radius:10px;padding:12px 16px;
    font-size:.95rem;font-weight:500;cursor:pointer;
    transition:opacity .2s,background .2s;
  }
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:active{opacity:.85;}
  .btn-ghost{
    background:transparent;color:var(--text-soft);
    border:1px solid var(--neutral-stroke);
  }
  .btn-ghost:active{background:var(--neutral);}
  .form-error{color:var(--negative);font-size:.8rem;min-height:1em;text-align:center;}

  /* ---------- Tela do relógio ---------- */
  #clock-screen{padding:0;}
  .topbar{
    position:absolute;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 16px;z-index:5;gap:8px;
  }
  .topbar .btn{padding:8px 14px;font-size:.8rem;}
  .clock-wrap{
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:14px;padding:60px 12px 80px;
  }
  .clock-name{
    font-size:1.1rem;font-weight:500;color:var(--primary);
    text-align:center;max-width:90vw;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .clock-svg-box{
    width:min(86vw,72vh);height:min(86vw,72vh);
  }
  .clock-svg-box svg{width:100%;height:100%;display:block;}
  .counter{
    display:flex;gap:22px;align-items:center;
    font-size:.95rem;
  }
  .counter .pos{color:var(--positive);font-weight:600;}
  .counter .neg{color:var(--negative);font-weight:600;}
  .counter .label{color:var(--text-soft);font-size:.78rem;display:block;text-align:center;}
  .counter .item{display:flex;flex-direction:column;align-items:center;}

  .sector{cursor:pointer;transition:fill .15s;}
  .sector-line{stroke:var(--neutral-stroke);stroke-width:1;}

  /* ---------- Histórico ---------- */
  #history-screen{padding:0;}
  .history-header{
    position:sticky;top:0;background:var(--bg);z-index:5;
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    padding:16px;border-bottom:1px solid var(--neutral-stroke);
  }
  .history-header h2{font-size:1.15rem;color:var(--primary);font-weight:600;margin-right:auto;}
  .history-header .btn{padding:8px 12px;font-size:.78rem;}
  .history-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
  .empty{color:var(--text-soft);text-align:center;margin-top:40px;font-size:.95rem;}
  .hist-item{
    background:#fff;border:1px solid var(--neutral-stroke);border-radius:14px;
    padding:14px;display:flex;gap:14px;align-items:center;
  }
  .hist-preview{width:64px;height:64px;flex-shrink:0;}
  .hist-preview svg{width:100%;height:100%;display:block;}
  .hist-info{flex:1;min-width:0;}
  .hist-info .h-name{font-weight:600;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hist-info .h-meta{font-size:.76rem;color:var(--text-soft);margin-top:3px;}
  .hist-info .h-counts{font-size:.76rem;margin-top:4px;}
  .hist-info .h-counts .pos{color:var(--positive);font-weight:600;}
  .hist-info .h-counts .neg{color:var(--negative);font-weight:600;}
  .hist-actions{display:flex;flex-direction:column;gap:6px;}
  .hist-actions .btn{padding:7px 12px;font-size:.74rem;white-space:nowrap;}
  .btn-danger{background:transparent;color:var(--negative);border:1px solid #E8CFC9;}
  .btn-danger:active{background:#F8EEEB;}

  /* ---------- Toast / Modal ---------- */
  #toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--primary);color:#fff;padding:12px 20px;border-radius:10px;
    font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
    z-index:50;max-width:90vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.error{background:var(--negative);}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(40,55,48,.4);
    display:none;align-items:center;justify-content:center;z-index:60;padding:24px;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:#fff;border-radius:16px;padding:24px;max-width:360px;width:100%;
    display:flex;flex-direction:column;gap:14px;
  }
  .modal p{font-size:.92rem;line-height:1.45;}
  .modal .modal-actions{display:flex;flex-direction:column;gap:8px;}
</style>
</head>
<body>

<!-- ====== TELA: FORMULÁRIO ====== -->
<div id="form-screen" class="screen active">
  <div class="card">
    <h1>Novo Relógio</h1>
    <div class="field">
      <label for="f-name">Nome do relógio</label>
      <input id="f-name" type="text" placeholder="Ex: Desafio 30 dias" maxlength="60">
    </div>
    <div class="field">
      <label for="f-size">Tamanho (nº de setores ≥ 2)</label>
      <input id="f-size" type="number" min="2" step="1" value="12" inputmode="numeric">
    </div>
    <div class="form-error" id="form-error"></div>
    <button class="btn btn-primary" id="f-confirm">Confirmar</button>
    <button class="btn btn-ghost" id="f-history">Ver histórico</button>
  </div>
</div>

<!-- ====== TELA: RELÓGIO ====== -->
<div id="clock-screen" class="screen">
  <div class="topbar">
    <button class="btn btn-ghost" id="c-new">+ Novo</button>
    <button class="btn btn-ghost" id="c-history">Histórico</button>
  </div>
  <div class="clock-wrap">
    <div class="clock-name" id="c-name"></div>
    <div class="clock-svg-box" id="c-svg-box"></div>
    <div class="counter">
      <div class="item"><span class="pos" id="c-pos">0</span><span class="label">a favor</span></div>
      <div class="item"><span class="neg" id="c-neg">0</span><span class="label">contra</span></div>
      <div class="item"><span id="c-neu" style="color:var(--text-soft);font-weight:600;">0</span><span class="label">neutros</span></div>
    </div>
  </div>
</div>

<!-- ====== TELA: HISTÓRICO ====== -->
<div id="history-screen" class="screen">
  <div class="history-header">
    <h2>Histórico</h2>
    <button class="btn btn-ghost" id="h-new">+ Novo</button>
    <button class="btn btn-ghost" id="h-export">Exportar</button>
    <button class="btn btn-ghost" id="h-import">Importar</button>
    <input type="file" id="h-import-input" accept=".json,application/json" style="display:none;">
  </div>
  <div class="history-body" id="history-body"></div>
</div>

<!-- ====== TOAST + MODAL ====== -->
<div id="toast"></div>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <p id="modal-text"></p>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "relogios_v1";
  const ACTIVE_KEY  = "relogio_ativo_v1";

  const COLORS = {
    0: "#F7F9F8",
    1: "#3D6B5E",
    2: "#C97B6E"
  };

  /* ---------- Estado em memória ---------- */
  let clocks = [];        // todos os relógios salvos
  let active = null;      // relógio ativo {id,name,size,sectors,createdAt}

  /* ---------- Persistência ---------- */
  function loadClocks(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      clocks = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(clocks)) clocks = [];
    }catch(e){ clocks = []; }
  }
  function saveClocks(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(clocks));
  }
  function setActiveId(id){
    if(id) localStorage.setItem(ACTIVE_KEY, id);
    else localStorage.removeItem(ACTIVE_KEY);
  }
  function getActiveId(){ return localStorage.getItem(ACTIVE_KEY); }

  function persistActive(){
    if(!active) return;
    const idx = clocks.findIndex(c => c.id === active.id);
    if(idx >= 0) clocks[idx] = active;
    else clocks.push(active);
    saveClocks();
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }

  /* ---------- Geometria SVG dos setores ---------- */
  function polar(cx, cy, r, angleDeg){
    const a = (angleDeg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  }
  function sectorPath(cx, cy, r, startAngle, endAngle){
    const start = polar(cx, cy, r, endAngle);
    const end   = polar(cx, cy, r, startAngle);
    const largeArc = (endAngle - startAngle) <= 180 ? 0 : 1;
    return [
      "M", cx, cy,
      "L", start.x.toFixed(3), start.y.toFixed(3),
      "A", r, r, 0, largeArc, 0, end.x.toFixed(3), end.y.toFixed(3),
      "Z"
    ].join(" ");
  }

  /* Cria SVG do relógio. interactive=true adiciona handlers de clique. */
  function buildClockSVG(clock, interactive){
    const size = 100, cx = 50, cy = 50, r = 48;
    const n = clock.size;
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
    svg.setAttribute("xmlns", ns);

    const sliceAngle = 360 / n;

    if(n === 1){
      const c = document.createElementNS(ns,"circle");
      c.setAttribute("cx",cx);c.setAttribute("cy",cy);c.setAttribute("r",r);
      c.setAttribute("fill", COLORS[clock.sectors[0]||0]);
      c.setAttribute("stroke","#D9E2DE");c.setAttribute("stroke-width","1");
      svg.appendChild(c);
      return svg;
    }

    for(let i=0;i<n;i++){
      const startAngle = i * sliceAngle;
      const endAngle = (i+1) * sliceAngle;
      const state = clock.sectors[i] || 0;
      const path = document.createElementNS(ns,"path");
      path.setAttribute("d", sectorPath(cx, cy, r, startAngle, endAngle));
      path.setAttribute("fill", COLORS[state]);
      path.setAttribute("class","sector sector-line");
      path.setAttribute("data-index", i);
      if(interactive){
        const handler = function(ev){
          ev.preventDefault();
          toggleSector(i);
        };
        path.addEventListener("click", handler);
      }
      svg.appendChild(path);
    }

    // contorno externo suave
    const outline = document.createElementNS(ns,"circle");
    outline.setAttribute("cx",cx);outline.setAttribute("cy",cy);outline.setAttribute("r",r);
    outline.setAttribute("fill","none");
    outline.setAttribute("stroke","#C9D6D0");outline.setAttribute("stroke-width","1");
    outline.setAttribute("pointer-events","none");
    svg.appendChild(outline);

    return svg;
  }

  /* ---------- Lógica de setores ---------- */
  function toggleSector(i){
    if(!active) return;
    active.sectors[i] = ((active.sectors[i]||0) + 1) % 3;
    persistActive();
    renderClock();   // re-render para refletir cor + contadores
  }

  function counts(clock){
    let pos=0,neg=0,neu=0;
    for(let i=0;i<clock.size;i++){
      const s = clock.sectors[i]||0;
      if(s===1)pos++; else if(s===2)neg++; else neu++;
    }
    return {pos,neg,neu};
  }

  /* ---------- Renderização das telas ---------- */
  function showScreen(id){
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  function renderClock(){
    if(!active) return;
    document.getElementById("c-name").textContent = active.name;
    const box = document.getElementById("c-svg-box");
    box.innerHTML = "";
    box.appendChild(buildClockSVG(active, true));
    const c = counts(active);
    document.getElementById("c-pos").textContent = c.pos;
    document.getElementById("c-neg").textContent = c.neg;
    document.getElementById("c-neu").textContent = c.neu;
  }

  function fmtDate(iso){
    try{
      const d = new Date(iso);
      return d.toLocaleDateString("pt-BR") + " " +
        d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    }catch(e){ return iso; }
  }

  function renderHistory(){
    const body = document.getElementById("history-body");
    body.innerHTML = "";
    if(clocks.length === 0){
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "Nenhum relógio salvo ainda.";
      body.appendChild(e);
      return;
    }
    // mais recentes primeiro
    const sorted = clocks.slice().sort((a,b)=> (b.createdAt||"").localeCompare(a.createdAt||""));
    sorted.forEach(clock=>{
      const item = document.createElement("div");
      item.className = "hist-item";

      const prev = document.createElement("div");
      prev.className = "hist-preview";
      prev.appendChild(buildClockSVG(clock, false));

      const info = document.createElement("div");
      info.className = "hist-info";
      const c = counts(clock);
      info.innerHTML =
        `<div class="h-name"></div>
         <div class="h-meta">${clock.size} setores · ${fmtDate(clock.createdAt)}</div>
         <div class="h-counts"><span class="pos">${c.pos} a favor</span> · <span class="neg">${c.neg} contra</span> · ${c.neu} neutros</div>`;
      info.querySelector(".h-name").textContent = clock.name;

      const actions = document.createElement("div");
      actions.className = "hist-actions";
      const loadBtn = document.createElement("button");
      loadBtn.className = "btn btn-primary";
      loadBtn.textContent = "Abrir";
      loadBtn.addEventListener("click", ()=> loadClock(clock.id));
      const delBtn = document.createElement("button");
      delBtn.className = "btn btn-danger";
      delBtn.textContent = "Excluir";
      delBtn.addEventListener("click", ()=> deleteClock(clock.id));
      actions.appendChild(loadBtn);
      actions.appendChild(delBtn);

      item.appendChild(prev);
      item.appendChild(info);
      item.appendChild(actions);
      body.appendChild(item);
    });
  }

  /* ---------- Ações ---------- */
  function createClock(name, size){
    const clock = {
      id: uid(),
      name: name,
      size: size,
      sectors: new Array(size).fill(0),
      createdAt: new Date().toISOString()
    };
    active = clock;
    persistActive();
    setActiveId(clock.id);
    renderClock();
    showScreen("clock-screen");
  }

  function loadClock(id){
    const clock = clocks.find(c=>c.id===id);
    if(!clock){ toast("Relógio não encontrado.", true); return; }
    // garante tamanho do array de setores
    if(!Array.isArray(clock.sectors)) clock.sectors = new Array(clock.size).fill(0);
    while(clock.sectors.length < clock.size) clock.sectors.push(0);
    active = clock;
    setActiveId(clock.id);
    renderClock();
    showScreen("clock-screen");
  }

  function deleteClock(id){
    confirmModal("Excluir este relógio do histórico?", [
      {label:"Excluir", cls:"btn-danger", action:()=>{
        clocks = clocks.filter(c=>c.id!==id);
        saveClocks();
        if(active && active.id===id){ active=null; setActiveId(null); }
        renderHistory();
        toast("Relógio excluído.");
      }},
      {label:"Cancelar", cls:"btn-ghost", action:()=>{}}
    ]);
  }

  /* ---------- Exportar / Importar ---------- */
  function exportClocks(){
    if(clocks.length===0){ toast("Nada para exportar.", true); return; }
    const data = JSON.stringify(clocks, null, 2);
    const blob = new Blob([data], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const today = new Date().toISOString().slice(0,10);
    const a = document.createElement("a");
    a.href = url;
    a.download = `relogios_backup_${today}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast("Backup exportado.");
  }

  function validClock(o){
    return o && typeof o==="object"
      && typeof o.name==="string"
      && Number.isInteger(o.size) && o.size>=2
      && Array.isArray(o.sectors)
      && typeof o.createdAt==="string";
  }

  function importClocks(file){
    const reader = new FileReader();
    reader.onload = function(){
      let parsed;
      try{ parsed = JSON.parse(reader.result); }
      catch(e){ toast("Arquivo JSON inválido.", true); return; }

      if(!Array.isArray(parsed)){
        toast("Estrutura incorreta: esperado uma lista de relógios.", true);
        return;
      }
      const valids = parsed.filter(validClock);
      if(valids.length === 0){
        toast("Nenhum relógio válido encontrado no arquivo.", true);
        return;
      }

      // detecta conflitos (mesmo nome + mesma data de criação)
      const conflicts = valids.filter(v =>
        clocks.some(c => c.name===v.name && c.createdAt===v.createdAt));

      function finish(mode){
        let imported = 0;
        valids.forEach(v=>{
          const dup = clocks.find(c=> c.name===v.name && c.createdAt===v.createdAt);
          if(dup){
            if(mode==="replace"){
              Object.assign(dup, {size:v.size, sectors:v.sectors.slice()});
              imported++;
            } else if(mode==="both"){
              clocks.push({...v, id:uid(), name:v.name+" (importado)"});
              imported++;
            } // mode skip => ignora
          } else {
            clocks.push({...v, id: v.id && !clocks.some(c=>c.id===v.id) ? v.id : uid()});
            imported++;
          }
        });
        saveClocks();
        renderHistory();
        toast(imported + " relógio(s) importado(s).");
      }

      if(conflicts.length>0){
        confirmModal(
          conflicts.length + " relógio(s) com mesmo nome e data já existem. O que deseja fazer?",
          [
            {label:"Substituir existentes", cls:"btn-primary", action:()=>finish("replace")},
            {label:"Manter ambos", cls:"btn-ghost", action:()=>finish("both")},
            {label:"Cancelar", cls:"btn-ghost", action:()=>{}}
          ]
        );
      } else {
        finish("new");
      }
    };
    reader.onerror = function(){ toast("Erro ao ler o arquivo.", true); };
    reader.readAsText(file);
  }

  /* ---------- Toast & Modal ---------- */
  let toastTimer;
  function toast(msg, isError){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "show" + (isError ? " error" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> t.className = (isError?"error":""), 2600);
  }

  function confirmModal(text, buttons){
    const overlay = document.getElementById("modal-overlay");
    document.getElementById("modal-text").textContent = text;
    const actions = document.getElementById("modal-actions");
    actions.innerHTML = "";
    buttons.forEach(b=>{
      const btn = document.createElement("button");
      btn.className = "btn " + (b.cls||"btn-ghost");
      btn.textContent = b.label;
      btn.addEventListener("click", ()=>{
        overlay.classList.remove("show");
        b.action();
      });
      actions.appendChild(btn);
    });
    overlay.classList.add("show");
  }

  /* ---------- Form ---------- */
  function handleConfirm(){
    const name = document.getElementById("f-name").value.trim();
    const sizeRaw = document.getElementById("f-size").value;
    const size = parseInt(sizeRaw, 10);
    const err = document.getElementById("form-error");
    err.textContent = "";
    if(!name){ err.textContent="Informe um nome para o relógio."; return; }
    if(!Number.isFinite(size) || size < 2){ err.textContent="O tamanho deve ser um inteiro ≥ 2."; return; }
    if(size > 200){ err.textContent="Tamanho máximo: 200 setores."; return; }
    createClock(name, size);
    document.getElementById("f-name").value="";
    document.getElementById("f-size").value="12";
  }

  /* ---------- Bind de eventos ---------- */
  document.getElementById("f-confirm").addEventListener("click", handleConfirm);
  document.getElementById("f-size").addEventListener("keydown", e=>{ if(e.key==="Enter") handleConfirm(); });
  document.getElementById("f-name").addEventListener("keydown", e=>{ if(e.key==="Enter") handleConfirm(); });
  document.getElementById("f-history").addEventListener("click", ()=>{ renderHistory(); showScreen("history-screen"); });

  document.getElementById("c-new").addEventListener("click", ()=> showScreen("form-screen"));
  document.getElementById("c-history").addEventListener("click", ()=>{ renderHistory(); showScreen("history-screen"); });

  document.getElementById("h-new").addEventListener("click", ()=> showScreen("form-screen"));
  document.getElementById("h-export").addEventListener("click", exportClocks);
  document.getElementById("h-import").addEventListener("click", ()=> document.getElementById("h-import-input").click());
  document.getElementById("h-import-input").addEventListener("change", function(){
    if(this.files && this.files[0]) importClocks(this.files[0]);
    this.value = "";
  });

  /* ---------- Inicialização ---------- */
  function init(){
    loadClocks();
    const activeId = getActiveId();
    if(activeId){
      const c = clocks.find(x=>x.id===activeId);
      if(c){ loadClock(c.id); return; }
    }
    showScreen("form-screen");
  }
  init();

})();
</script>
</body>
</html>
